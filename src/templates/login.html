{% extends "auth_base.html" %}
{% block title %}Sign in — NLC Dashboard{% endblock %}
{% block auth %}
<h1>NLC Dashboard</h1>
<p class="sub">Sign in with your @nlcfcpa.com email and password.</p>

{% if error %}<div class="msg msg-err">{{ error }}</div>{% endif %}

<form method="post" action="{{ url_for('login') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label for="email">Work email</label>
  <input type="email" id="email" name="email" value="{{ email }}" autocomplete="email"
         placeholder="you@nlcfcpa.com" autofocus required>
  <label for="password">Password</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required>
  <label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;
               font-weight:500;font-size:13px;color:var(--text);margin:-4px 0 16px;cursor:pointer">
    <input type="checkbox" name="remember" style="width:15px;height:15px;accent-color:var(--navy)">
    Remember me on this device for a week
  </label>
  <button type="submit" class="btn">Sign in</button>
</form>

<div class="auth-foot">
  No account? <a href="{{ url_for('signup') }}">Request access</a>
</div>
{% endblock %}
