<html lang="en">
<head>

<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1a3f8f">
<meta name="application-name" content="NLC Dashboard">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NLC Dashboard">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<style>
/* Standalone page shell — a centred card with no sidebar, used by the error
   pages. Mirrors the dashboard's letterhead identity (see app.css): Georgia
   titles, the firm navy, a faintly warm "paper" field, and the letterhead
   double rule (navy over green) beneath the mark. Fonts are system faces
   (Georgia / Segoe UI) so this works offline and under font-src 'self'. */
:root{
  --navy:#1a3f8f;--green:#4a9d4f;--text:#16202e;--muted:#55606f;--border:#e4ddd0;
  --serif:Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:radial-gradient(1200px 600px at 50% -10%, #fbf9f4, #efe9dd);
  color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  -webkit-font-smoothing:antialiased}
.page-card{background:#fff;border:1px solid var(--border);border-radius:16px;
  box-shadow:0 1px 2px rgba(20,41,79,.06),0 18px 50px rgba(20,41,79,.14);
  width:100%;max-width:404px;padding:32px 32px 26px}
.page-logo{display:flex;justify-content:center;margin-bottom:14px}
.page-logo svg{display:block}
/* The signature double rule, echoing the letterhead frame. */
.page-rule{height:2px;background:var(--navy);position:relative;margin:0 auto 18px;width:56px;border-radius:2px}
.page-rule::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1.5px;background:var(--green)}
h1{font-family:var(--serif);font-size:23px;font-weight:700;text-align:center;
  letter-spacing:-.01em;margin-bottom:5px}
.sub{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:22px;line-height:1.5}
.page-foot{text-align:center;font-size:12.5px;color:var(--muted);margin-top:18px}
.page-foot a{color:var(--navy);text-decoration:none;font-weight:600}
.page-foot a:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="page-card">
    <div class="page-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 62" width="150" height="55" role="img" aria-label="NLC">
        <rect x="1.5" y="1.5" width="165" height="59" fill="#ffffff" stroke="#1a3f8f" stroke-width="2" rx="3"/>
        <rect x="6" y="6" width="156" height="50" fill="none" stroke="#4a9d4f" stroke-width="1" rx="2"/>
        <text x="84" y="45" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
              font-weight="700" font-size="42" letter-spacing="2">
          <tspan fill="#1a3f8f">N</tspan><tspan fill="#4a9d4f">L</tspan><tspan fill="#1a3f8f">C</tspan>
        </text>
      </svg>
    </div>
    <div class="page-rule"></div>
    {% block standalone %}{% endblock %}
  </div>
<script nonce="{{ csp_nonce }}">
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () { /* non-fatal */ });
    });
  }
</script>
</body>
</html>
